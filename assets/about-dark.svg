<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="294" viewBox="0 0 1180 294" fill="none" role="img" aria-labelledby="title desc"><title id="title">About Emirhan: play, create and understand</title><desc id="desc">About Emirhan: play, create and understand</desc><style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style><rect x="1" y="1" width="1178" height="292" rx="18" fill="#131a24" stroke="#293343" /><circle cx="21" cy="24" r="4" fill="#ed7180"/><circle cx="37" cy="24" r="4" fill="#eac66b"/><circle cx="53" cy="24" r="4" fill="#8bc88d"/><text x="590.0" y="28" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" font-weight="400" fill="#65768d" text-anchor="middle">~/about.md</text><path d="M17 46H1163" stroke="#293343" /><text x="28" y="91" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="28" font-weight="650" fill="#f0f3f8" >One curiosity. Three directions.</text><text x="28" y="134" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" font-weight="400" fill="#65768d" >01</text><text x="60" y="134" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" font-weight="600" fill="#c3f66b" letter-spacing="1.5">PLAY</text><text x="28" y="176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#f0f3f8" >Games that feel good.</text><text x="28" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#9aaac0" >Building mobile games with Unity and C#.</text><text x="28" y="235" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#9aaac0" >Gameplay systems, responsive UI,</text><text x="28" y="260" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#9aaac0" >and performance on real devices.</text><text x="424" y="134" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" font-weight="400" fill="#65768d" >02</text><text x="456" y="134" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" font-weight="600" fill="#77dce8" letter-spacing="1.5">CREATE</text><text x="424" y="176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#f0f3f8" >Tools that remove friction.</text><text x="424" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#9aaac0" >Connecting creative software to MCP.</text><text x="424" y="235" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#9aaac0" >Photoshop, Blender and After Effects,</text><text x="424" y="260" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#9aaac0" >with editable outputs and local workflows.</text><text x="820" y="134" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" font-weight="400" fill="#65768d" >03</text><text x="852" y="134" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" font-weight="600" fill="#c2a5ff" letter-spacing="1.5">UNDERSTAND</text><text x="820" y="176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#f0f3f8" >Go beneath the surface.</text><text x="820" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#9aaac0" >Exploring C, memory and OS internals.</text><text x="820" y="235" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#9aaac0" >From a RISC-V kernel to a raycaster,</text><text x="820" y="260" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#9aaac0" >learning by building the foundations.</text><path d="M395 119L395 265" stroke="#293343" /><path d="M791 119L791 265" stroke="#293343" /></svg>
